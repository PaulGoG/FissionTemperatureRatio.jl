# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/bench"
      - "/docs"
      - "/formatter"
      - "/test"
    schedule:
      interval: "weekly"
    # Standard libraries ship with Julia itself. Pinning one to the version carried by a single
    # release makes the declared compatibility floor unsatisfiable, which has broken this
    # repository once already; their entries stay at "1".
    ignore:
      - dependency-name: "Dates"
      - dependency-name: "LinearAlgebra"
      - dependency-name: "Pkg"
      - dependency-name: "Statistics"
      - dependency-name: "TOML"
      - dependency-name: "Test"
    groups:
      julia-dependencies:
        patterns:
          - "*"
