name: Format
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  contents: read
jobs:
  format:
    name: JuliaFormatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Check formatting against .JuliaFormatter.toml
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate("formatter")
          Pkg.instantiate()
          using JuliaFormatter
          targets = ("src", "test", "scripts", "bench", "docs", "ext", "formatter",
                     "activate.jl", "check.jl")
          formatted = all([format(target; overwrite = false) for target in targets])
          if !formatted
              @error "Formatting differs from .JuliaFormatter.toml. Run `julia check.jl` locally."
              exit(1)
          end
