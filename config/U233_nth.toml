# Thermal-neutron-induced fission of 233-U.

[system]
target_A = 233                                # mass number of the target nuclide, 2 to 400
target_Z = 92                                 # charge number of the target nuclide, 1 to 118
channel = "nth"                               # entrance channel; one of: "nfast" | "nres" | "nth" | "sf"
incident_energy = 2.53e-8                     # incident neutron energy in MeV, at least 0; 0 for "sf"

[fragmentation]
charges_per_mass = 5                          # charge numbers per mass number, odd, 1 to 15
heavy_mass_min = 117                          # smallest heavy-fragment mass number, at least the symmetric split A0/2
heavy_mass_max = 159                          # largest heavy-fragment mass number, below A0
charge_distribution_file = "wahl"             # isobaric charge distribution; one of: "wahl" | "mean", or a table A dZ sigma_Z relative to data/
zero_polarization_at_symmetry = false         # dZ = 0 at A0/2 for a table or "mean"; not allowed with "wahl"

[level_density]
model = "BSFG"                                # level density model; one of: "BSFG" | "GC"
mass_excess_file = "ame2020"                  # "ame2020" (shipped), or a mass-excess table relative to data/
shell_correction_file = "gilbert_cameron_1965"  # "gilbert_cameron_1965" (shipped), or a table relative to data/; read by "GC"
deformed_branch = true                        # "GC" only; true: eq. (21) for deformed nuclei, false: eq. (20) throughout
ratio_averaging = "charge_resolved"           # reduction of a_L/a_H over the charges; one of: "charge_resolved" | "ratio_of_means" | "mean_of_ratios"
mean_kinetic_energy_file = "U233_nth/TKE_vs_A/21981008_P.Geltenbort_1985.dat"  # pre-neutron <TKE>(A) in MeV, relative to data/; "charge_resolved" only; optional

[multiplicity]
subdirectory = "U233_nth/nu_vs_A"             # under data/; whitespace-separated A nu nu_uncertainty
# exclude: datasets kept out of the pooled trend, [{ accession = EXFOR dataset identifier, reason = text }]; optional

[yield]
mass_yield_file = "U233_nth/Y_vs_A/21981005_P.Geltenbort_1985.dat"  # primary pre-neutron Y(A), A Y Y_uncertainty, relative to data/
# subdirectory: every Y(A) under data/ to average over in place of the primary alone; optional
# exclude: Y(A) under subdirectory kept out of every average, as [{ accession = EXFOR dataset identifier, reason = text }]; optional
symmetrize = true                             # average Y(A) and Y(A0 - A) where both are measured
min_yield_coverage = 0.3                      # share of the primary Y(A)'s heavy-fragment yield a distribution must cover to be averaged over, 0 to 1

[segments]
max_segments = 6                              # largest segment count examined, 1 to 12
min_points_per_segment = 4                    # data points a segment must contain, 2 to 50
pin_symmetric_split = true                    # fix r_nu = 1/2 at A0/2; requires even A0 and heavy_mass_min = A0/2
required_windows = [[128, 132]]               # windows the trend curve must break in, inside heavy_mass_min:heavy_mass_max
windows_apply_to_datasets = false             # apply the windows to each dataset too, not only to the trend
min_pair_coverage = 0.3                       # fraction of the range's heavy masses a nu(A) dataset must pair to offer a curve of its own, 0 to 1
autocorrelation_lags = 4                      # lags of the deviation correlogram the trend's autocorrelation is fitted to, 1 to 8

[retrieval]
min_package_version = "0.2.7"                 # lowest ExforFissionData version whose retrieval records are accepted

[output]
significant_digits = 6                        # significant figures in tabulated output, 1 to 15
