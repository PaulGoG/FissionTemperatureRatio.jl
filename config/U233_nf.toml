# Thermal-neutron-induced fission of 233-U.

[system]
target_A = 233                                # mass number of the target nuclide, 2 to 400
target_Z = 92                                 # charge number of the target nuclide, 1 to 118
reaction = "n,f"                              # one of: "0,f" | "n,f"
incident_energy = 2.53e-8                     # MeV, at least 0; must be 0 for "0,f"

[fragmentation]
charges_per_mass = 5                                # charge numbers per mass number, odd, 1 to 15
A_H_max = 159                                       # largest heavy-fragment mass number, below A0
# charge_distribution_file: tabulated ΔZ(A) and rms(A), relative to data/; absent here, so the
# average values below apply over the whole range
fallback_charge_polarization = -0.5                 # ΔZ where untabulated, -5 to 5
fallback_rms = 0.6                                  # Gaussian dispersion where untabulated, > 0 to 5

[level_density]
prescription = "BSFG"                               # one of: "BSFG" | "GC"
mass_excess_file = "mass_excess/AME2020.ANA"        # relative to data/; used by "BSFG"
shell_correction_file = "shell_corrections/SZSN.GC"  # relative to data/; required by "GC"
ratio_averaging = "ratio_of_means"                  # one of: "ratio_of_means" | "mean_of_ratios"

[multiplicity]
directory = "multiplicity/U233_nf"                  # relative to data/

[yield]
directory = "yield/U233_nf"       # pre-neutron mass yields Y(A), relative to data/; optional

[segments]
max_segments = 6                                    # largest segment count examined, 1 to 12
min_points_per_segment = 4                          # data points a segment must contain, 2 to 50
pin_symmetric_split = true                          # fix r_nu = 1/2 at A0/2; requires even A0
required_windows = [[128, 132]]                    # windows the systematic-trend curve must break in

[output]
digits = 6                                          # decimals in tabulated output, 1 to 15
subdirectory = "U233_nf"                            # under results/ and plots/
