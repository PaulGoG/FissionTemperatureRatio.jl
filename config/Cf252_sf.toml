# Spontaneous fission of 252-Cf.

[system]
target_A = 252                                # mass number of the target nuclide, 2 to 400
target_Z = 98                                 # charge number of the target nuclide, 1 to 118
channel = "sf"                                # entrance channel; one of: "nfast" | "nres" | "nth" | "sf"

[fragmentation]
charges_per_mass = 5                          # charge numbers per mass number, odd, 1 to 15
heavy_mass_min = 126                          # smallest heavy-fragment mass number, at least the symmetric split A0/2
heavy_mass_max = 174                          # largest heavy-fragment mass number, below A0
charge_distribution_file = "wahl"             # one of: "wahl" | "mean", or a table A dZ sigma_Z relative to data/
zero_polarization_at_symmetry = false         # dZ = 0 at A0/2 for a table or "mean"; not allowed with "wahl"

[level_density]
model = "BSFG"                                # one of: "BSFG" | "GC"
mass_excess_file = "ame2020"                  # "ame2020", the evaluation FissionFragmentsDomain ships, or a table relative to data/
shell_correction_file = "gilbert_cameron_1965"  # "gilbert_cameron_1965", Table III as FissionFragmentsDomain ships it, or a table relative to data/; read by "GC"
deformed_branch = true                        # "GC" only: true takes c = 0.120 for deformed nuclei (eq. 21), false c = 0.142 throughout (eq. 20)
ratio_averaging = "charge_resolved"           # one of: "charge_resolved" | "ratio_of_means" | "mean_of_ratios"
mean_kinetic_energy_file = "Cf252_sf/TKE_vs_A/23268004_A.Goeoek_2014.dat"  # pre-neutron <TKE>(A) in MeV, relative to data/; "charge_resolved" only; optional

[multiplicity]
subdirectory = "Cf252_sf/nu_vs_A"             # under data/; whitespace-separated A nu nu_uncertainty
# exclude: datasets kept out of the pooled trend, as [{ accession = EXFOR dataset identifier, reason = text }]; each still offers its own curve
exclude = [
    { accession = "41739002", reason = "EXFOR 41739002, a check of revised analysis software on 0.5e6 coincidences of earlier IRMM data, statistical uncertainties only: its yield-weighted light-fragment multiplicity is 1.71 against 2.01 to 2.12 in Goeoek 2014, Budtz-Jorgensen 1988, Zeynalov 2011 and Al-Adili 2020, the pair sum 3.47 against a nu-bar of 3.76; a deficit on one wing does not cancel in r_nu, which lies 0.03 to 0.08 above the consensus of the other sets over A_H = 130 to 160" },
]

[yield]
mass_yield_file = "Cf252_sf/Y_vs_A/23268003_A.Goeoek_2014.dat"  # primary pre-neutron Y(A), A Y Y_uncertainty, relative to data/; averaged over alone, or the coverage reference of subdirectory
# subdirectory: every Y(A) under data/ to average over in place of the primary alone; optional
# exclude: Y(A) under subdirectory kept out of every average, as [{ accession = EXFOR dataset identifier, reason = text }]; optional
symmetrize = true                             # Y(A) and Y(A0 - A) averaged where both are measured (pre-neutron identity)
min_yield_coverage = 0.3                      # share of the primary Y(A)'s heavy-fragment yield a distribution must cover to be averaged over, 0 to 1

[segments]
max_segments = 6                              # largest segment count examined, 1 to 12
min_points_per_segment = 4                    # data points a segment must contain, 2 to 50
min_segment_span = 3                          # smallest extent of a segment in mass units, 1 to 50
pin_symmetric_split = true                    # fix r_nu = 1/2 at A0/2; requires even A0 and heavy_mass_min = A0/2
required_windows = [[128, 132]]               # windows the trend curve must break in, inside heavy_mass_min:heavy_mass_max
windows_apply_to_datasets = false             # apply the windows to each dataset too, not only to the trend
min_pair_coverage = 0.3                       # fraction of the range's heavy masses a nu(A) dataset must pair to offer a curve of its own, 0 to 1

[retrieval]
min_package_version = "0.2.3"                 # lowest ExforFissionData version whose retrieval records are accepted; a record below it, or stating none, is refused

[output]
significant_digits = 6                        # significant figures in tabulated output, 1 to 15
